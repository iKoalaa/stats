name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive -derivedDataPath "$RUNNER_TEMP/stats-build" CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
      - name: Fan curve safety tests
        run: python3 Kit/scripts/run-fan-tests.py --products "$RUNNER_TEMP/stats-build/Build/Intermediates.noindex/ArchiveIntermediates/Stats/BuildProductsPath/Release" --build-dir "$RUNNER_TEMP/stats-fan-tests"
